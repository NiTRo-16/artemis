# Artemis behind Caddy, which serves HTTPS for your domain with automatic certificates.
# Setup and checks: see DEPLOY.md.

services:
  app:
    build: .
    restart: unless-stopped
    init: true                     # reaps Chromium's child processes
    shm_size: "1gb"                # Chromium uses /dev/shm; Docker's 64 MB default crashes pages
    mem_limit: 2g
    pids_limit: 512
    cap_drop: [ALL]
    security_opt:
      - seccomp=deploy/seccomp_profile.json   # Playwright's profile; lets Chromium's sandbox create namespaces
      - no-new-privileges:true
    environment:
      # Trust X-Forwarded-For only from Caddy's fixed address below. The rate limiter needs the real
      # client IP, and nothing else should be able to claim one.
      FORWARDED_ALLOW_IPS: "172.29.0.10"
      SAFE_BROWSING_API_KEY: ${SAFE_BROWSING_API_KEY:-}
      URLHAUS_AUTH_KEY: ${URLHAUS_AUTH_KEY:-}
      ARTEMIS_CHROMIUM_SANDBOX: ${ARTEMIS_CHROMIUM_SANDBOX:-1}
      # Account emails. Links in them are built from APP_URL, never from the request.
      APP_URL: https://${DOMAIN:?Set DOMAIN in .env}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env (see DEPLOY.md)}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM in .env}
      # Optional "Continue with Google". Set both or neither.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DATABASE_URL: postgresql://artemis:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/artemis
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_SECRET: ${RATE_LIMIT_SECRET:?Set RATE_LIMIT_SECRET in .env}
      WATCH_PUBLIC: ${WATCH_PUBLIC:-0}
    volumes:
      # The old SQLite database, read once by tools/migrate_sqlite.py. Accounts now live in Postgres.
      - artemis_data:/app/data
    networks:
      - front
      - egress
      - data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Runs scans from the queue, each with its own sandboxed Chromium. More capacity:
  #   docker compose up -d --scale worker=2
  worker:
    build: .
    command: ["python", "worker.py"]
    restart: unless-stopped
    init: true                     # reaps Chromium's child processes
    shm_size: "1gb"                # Chromium uses /dev/shm; Docker's 64 MB default crashes pages
    mem_limit: 2g
    pids_limit: 512
    cap_drop: [ALL]
    security_opt:
      - seccomp=deploy/seccomp_profile.json
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgresql://artemis:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/artemis
      REDIS_URL: redis://redis:6379/0
      SAFE_BROWSING_API_KEY: ${SAFE_BROWSING_API_KEY:-}
      URLHAUS_AUTH_KEY: ${URLHAUS_AUTH_KEY:-}
      ARTEMIS_CHROMIUM_SANDBOX: ${ARTEMIS_CHROMIUM_SANDBOX:-1}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      WATCH_PUBLIC: ${WATCH_PUBLIC:-0}
    healthcheck:
      disable: true                # the app's /healthz reports whether a worker is alive
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - egress
      - data
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Domain watch: reads certificate logs. One only; limited so it can't take CPU from scans.
  watcher:
    build: .
    command: ["python", "watcher.py"]
    restart: unless-stopped
    init: true
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 64
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgresql://artemis:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/artemis
      REDIS_URL: redis://redis:6379/0
      WATCH_SCANS: ${WATCH_SCANS:-0}
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - egress
      - data
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  redis:
    image: redis:7.4
    # Memory only, never written to disk: rate-limit keys stand for visitors' networks.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - data

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: artemis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: artemis
    volumes:
      - pg_data:/var/lib/postgresql/data   # accounts, history, reports and shared results; back this up
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "artemis"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - data
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2.11                # 2.11+ needed for time-based log rotation (roll_interval)
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]      # the only privilege Caddy needs: listening on ports 80 and 443
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Goes through Caddy to the app; also keeps the access log rotating daily (see deploy/Caddyfile).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10m
      timeout: 10s
      start_period: 30s
    depends_on:
      app:
        condition: service_healthy   # don't serve a deployment whose browser check is broken
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data             # certificates; keep this volume
      - caddy_config:/config
      - caddy_logs:/logs             # access log, pruned to 14 days by Caddy itself
    networks:
      front:
        ipv4_address: 172.29.0.10    # fixed, so the app can trust exactly this proxy
      public: {}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  front:
    internal: true                   # Caddy <-> app only, no internet access
    ipam:
      config:
        - subnet: 172.29.0.0/24
  egress:
    # The app's route to the internet. deploy/egress-firewall.sh blocks private ranges for this
    # subnet on the host; keep the two in sync if you change it.
    ipam:
      config:
        - subnet: 172.30.0.0/24
  public: {}
  data:
    internal: true                   # app, worker, Redis and Postgres only; no internet access

volumes:
  artemis_data:
  pg_data:
  caddy_data:
  caddy_config:
  caddy_logs:
